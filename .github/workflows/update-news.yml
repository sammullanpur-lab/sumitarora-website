
name: Update Technology News

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify website files
        run: |
          ls -la it-insights-intelligence-hub/scripts/
          ls -la it-insights-intelligence-hub/content/

      - name: Update technology headlines
        working-directory: it-insights-intelligence-hub
        run: python scripts/update_news.py

     
      - name: Commit updated news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add it-insights-intelligence-hub/content/news.json

          if git diff --cached --quiet; then
            echo "No news changes to commit."
            exit 0
          fi

          git commit -m "Automated technology news update"

          for attempt in 1 2 3; do
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "News successfully published to GitHub."
                exit 0
              fi
            else
              git rebase --abort
              echo "Rebase conflict detected. Stopping safely."
              exit 1
            fi

            echo "Push conflict. Retrying..."
            sleep 5
          done

          echo "Unable to publish news after 3 attempts."
          exit 1
