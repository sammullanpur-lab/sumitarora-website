
name: Update Technology News

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify website files
        run: |
          ls -la it-insights-intelligence-hub/scripts/
          ls -la it-insights-intelligence-hub/content/

      - name: Update technology headlines
        working-directory: it-insights-intelligence-hub
        run: python scripts/update_news.py

      - name: Commit updated news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add it-insights-intelligence-hub/content/news.json

          if ! git diff --cached --quiet; then
            git commit -m "Automated technology news update"
            git push
          else
            echo "No news changes to commit."
          fi
