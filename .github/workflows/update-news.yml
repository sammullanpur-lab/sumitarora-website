
name: Update Technology News

on:
  schedule:
    - cron: "17 12 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

- name: Update technology headlines
  run: python it-insights-intelligence-hub/scripts/update_news.py

      - name: Commit updated news
        run: |
          if [ -n "$(git status --porcelain -- content/news.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/news.json
            git commit -m "Automated technology news update"
            git push
          else
            echo "No news changes to commit."
          fi
