
name: Update Technology News

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: technology-news-update
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Update technology headlines
        working-directory: it-insights-intelligence-hub
        run: python scripts/update_news.py

      - name: Commit and push news
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          NEWS_FILE="it-insights-intelligence-hub/content/news.json"

          git add "$NEWS_FILE"

          if git diff --cached --quiet; then
            echo "No news changes to publish."
            exit 0
          fi

          git commit -m "Automated technology news update"

          for attempt in 1 2 3; do
            echo "Push attempt $attempt"

            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort
              echo "Rebase conflict. Stopping safely."
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "SUCCESS: Technology news published."
              exit 0
            fi

            echo "Remote changed again. Retrying..."
            sleep 5
          done

          echo "ERROR: Could not publish after 3 attempts."
          exit 1
